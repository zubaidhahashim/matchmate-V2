<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MatchMate{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container-xl">

            <a class="navbar-brand" href="/">
                MatchMate
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/analysis">Resume Analysis</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/optimizer">Resume Optimizer</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/interview">Interview Coach</a>
                    </li>

                    

                    <li class="nav-item">
                        <a class="nav-link" href="/reports">Reports</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================= PAGE CONTENT ================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- ================= LOADING SCREEN ================= -->

    <div id="loading-screen">

        <div class="loader-card">

            <div class="spinner"></div>

            <h2>Analyzing Resume...</h2>

            <p id="loading-text">

                Please wait while MatchMate analyzes your resume.

            </p>

        </div>

    </div>

    <!-- ================= BOOTSTRAP ================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ================= PAGE SCRIPTS ================= -->

    {% block scripts %}
    {% endblock %}

</body>

</html>
